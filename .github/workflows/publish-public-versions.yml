name: Publish InkWords public release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-public-versions.yml
      - docs/releases/**
permissions:
  contents: write
concurrency:
  group: publish-inkwords-public-versions
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public build and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify source and public examples
        run: |
          python tools/prepare_downloads.py
          python build.py
          python tests/smoke.py
          python tests/test_import.py
          python tests/test_digest.py
          python tests/test_progress.py
          python tools/lualint55.py apps/inkwords/src/main.lua
      - name: Publish verified package with detailed notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py
